name: Feed

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    # A closed pull request that was not merged has nothing to check.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: false
      - name: Check the feed
        run: make -C tools check

  publish:
    # Merge publishes on its own. Run workflow on the Actions page publishes main by hand.
    # A direct push to main does not start this workflow.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged }}
    needs: check
    concurrency:
      group: feed-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Stamp the publication date
        if: github.event_name == 'pull_request'
        env:
          MERGE: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          BEFORE=$(git rev-parse "$MERGE^1")
          BEFORE="$BEFORE" HEAD="$MERGE" python3 tools/scripts/stamp-publish-date.py
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: false
      - name: Package the feed
        env:
          HUGO_PARAMS_ASSETBASE: https://raw.githubusercontent.com/${{ github.repository }}/feed
        run: make -C tools package
      - name: Publish the feed branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh tools/scripts/publish-feed-branch.sh
      - name: Ask WordPress to import
        if: ${{ vars.WORDPRESS_SYNC_URL != '' }}
        env:
          SYNC_URL: ${{ vars.WORDPRESS_SYNC_URL }}
          SYNC_SECRET: ${{ secrets.WORDPRESS_SYNC_SECRET }}
        run: |
          secret=$(printf '%s' "$SYNC_SECRET" | tr -d '\r\n')
          if [ -z "$secret" ]; then
            echo "WORDPRESS_SYNC_SECRET is empty."
            exit 1
          fi
          echo "Sending a secret of ${#secret} characters."
          printf 'X-Percona-Blog-Secret: %s\n' "$secret" > /tmp/sync-header
          code=$(curl --silent --show-error --output /tmp/wp-sync.json --write-out '%{http_code}' \
            -X POST \
            -H @/tmp/sync-header \
            "${SYNC_URL}")
          cat /tmp/wp-sync.json
          echo
          if [ "$code" != "200" ]; then
            echo "WordPress returned HTTP ${code}."
            exit 1
          fi
      - name: Store the publication date
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -u -- posts
          if git diff --cached --quiet; then
            echo "No publication dates to store"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Set the publication date of posts published by this build [skip ci]"
          git push
