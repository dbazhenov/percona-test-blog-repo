name: Preview comment

# Render records a GitHub deployment for the pull request commit. A workflow
# that listens for deployment_status is read from that commit, so a file that
# exists only on main never starts. This workflow is read from main instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number
            const origin = `https://percona-test-blog-repo-pr-${pr}.onrender.com`
            const marker = '<!-- render-preview -->'

            function unquote(value) {
              const trimmed = value.trim()
              if (
                (trimmed.startsWith('"') && trimmed.endsWith('"')) ||
                (trimmed.startsWith("'") && trimmed.endsWith("'"))
              ) {
                return trimmed.slice(1, -1)
              }
              return trimmed
            }

            function field(frontMatter, key) {
              const match = frontMatter.match(new RegExp('^' + key + ':\\s*(.*)$', 'm'))
              return match ? unquote(match[1]) : ''
            }

            function stripDate(name) {
              return name.replace(/^\d{4}-\d{2}-\d{2}-/, '')
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              per_page: 100,
            })
            const posts = []
            for (const file of files) {
              if (file.status === 'removed') continue
              const match = file.filename.match(/^posts\/(\d{4})\/([^/]+?)(?:\/index\.md|\.md)$/)
              if (!match) continue
              const year = match[1]
              const folder = match[2]
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: file.filename,
                ref: context.payload.pull_request.head.sha,
              })
              const text = Buffer.from(response.data.content, 'base64').toString('utf8')
              const front = text.startsWith('---') ? text.slice(3, text.indexOf('\n---', 3)) : ''
              const id = field(front, 'id') || folder
              const slug = field(front, 'slug') || stripDate(id)
              const title = field(front, 'title') || slug
              posts.push({ title, url: `${origin}/blog/${year}/${slug}/` })
            }

            const lines = [
              marker,
              'Thank you for opening this pull request.',
              '',
            ]
            if (posts.length === 1) {
              lines.push(`This is a preview, not the published post: [${posts[0].title}](${posts[0].url})`)
            } else if (posts.length > 1) {
              lines.push('These are previews, not the published posts:')
              lines.push('')
              for (const post of posts) {
                lines.push(`- [${post.title}](${post.url})`)
              }
            } else {
              lines.push(`This is a preview of the site, not the published blog: ${origin}/`)
            }
            lines.push('')
            lines.push('To change the post, push another commit to this same branch. The preview updates from that commit.')
            lines.push('')
            lines.push('The preview includes drafts. Render removes it when the pull request is merged or closed.')
            const body = lines.join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.user.login === 'github-actions[bot]' && comment.body && comment.body.includes(marker))
            if (existing) {
              if (existing.body.trim() === body.trim()) {
                core.info('Preview comment is already current')
                return
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            })
