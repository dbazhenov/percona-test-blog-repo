name: Preview comment

on:
  deployment_status:

permissions:
  pull-requests: write

jobs:
  comment:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.deployment_status || {}
            const url = status.environment_url || status.target_url || ''
            const match = url.match(/-pr-(\d+)\.onrender\.com/)
            if (!match) {
              core.info('Not a Render pull request preview: ' + url)
              return
            }
            const pr = Number(match[1])
            const marker = '<!-- render-preview -->'
            const body = [
              marker,
              `Preview: ${url}`,
              '',
              'This copy includes drafts. Render deletes it when the pull request is merged or closed.',
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker))
            if (existing) {
              if (existing.body.includes(url)) {
                core.info('Preview comment already has this URL')
                return
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            })
