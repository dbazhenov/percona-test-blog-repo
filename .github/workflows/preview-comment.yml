name: Preview comment

# Render records a GitHub deployment for the pull request commit. A workflow
# that listens for deployment_status is read from that commit, so a file that
# exists only on main never starts. This workflow is read from main instead.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Comment the preview link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number
            const url = `https://percona-test-blog-repo-pr-${pr}.onrender.com/`
            const marker = '<!-- render-preview -->'
            const body = [
              marker,
              `Preview: ${url}`,
              '',
              'Render builds this copy from the pull request. It includes drafts and is removed when the pull request is merged or closed.',
            ].join('\n')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.user.login === 'github-actions[bot]' && comment.body && comment.body.includes(marker))
            if (existing) {
              if (existing.body.includes(url)) {
                core.info('Preview comment already has this URL')
                return
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            })
